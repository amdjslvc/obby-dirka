<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Obby Dirka</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏁</text></svg>" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <!-- ===== HUD med igro ===== -->
  <div id="hud" hidden>
    <div id="timer">0:00.00</div>
    <div id="coinHud" hidden></div>
    <div id="levelName"></div>
    <div id="toast"></div>
    <div id="countdown"></div>
    <div id="crosshair">+</div>
    <div id="results" hidden></div>
    <div id="help"></div>
    <div id="hotbar" hidden></div>
    <div id="touch"></div>
  </div>

  <!-- ===== Meni ===== (besedila prevaja src/i18n.js) -->
  <div id="menu">
    <div class="panel">
      <div class="corner">
        <select id="langSelect" data-i18n-title="lang"></select>
        <button id="musicBtn" data-i18n-title="music">🔊</button>
      </div>
      <h1>OBBY <span data-i18n="title2">DIRKA</span></h1>

      <button id="resumeBtn" class="big primary" hidden data-i18n="resume"></button>
      <p id="menuMsg" class="muted"></p>

      <section>
        <h2><span data-i18n="yourChar"></span> <span id="wallet" class="wallet"></span></h2>
        <div class="row">
          <input id="nameInput" maxlength="16" data-i18n-ph="namePh" />
        </div>
        <div id="skins" class="row"></div>
        <div id="hats" class="hats"></div>
      </section>

      <section>
        <h2><span data-i18n="track"></span> <input id="levelNameInput" maxlength="40" class="inline" /></h2>
        <div class="row">
          <button id="playBtn" class="big primary" data-i18n="play"></button>
          <button id="editBtn" class="big" data-i18n="editor"></button>
        </div>
        <div class="row small">
          <button id="shareBtn" data-i18n="share"></button>
          <button id="loadBtn" data-i18n="loadCode"></button>
          <button id="saveBtn" data-i18n="save"></button>
          <button id="newBtn" data-i18n="new"></button>
          <button id="sampleBtn" data-i18n="sample"></button>
        </div>
        <div id="shareBox" hidden>
          <textarea id="codeArea" rows="3" spellcheck="false"></textarea>
          <div class="row small">
            <button id="codeOkBtn" class="primary" data-i18n="load"></button>
            <span id="codeMsg" class="muted"></span>
          </div>
        </div>
        <div id="savedList" class="row small"></div>
      </section>

      <section>
        <h2 data-i18n="playFriends"></h2>
        <div id="roomOut" class="row">
          <button id="createRoomBtn" data-i18n="createRoom"></button>
          <input id="roomInput" maxlength="4" class="code" data-i18n-ph="codePh" />
          <button id="joinRoomBtn" data-i18n="join"></button>
        </div>
        <div id="roomIn" hidden>
          <p><span data-i18n="room"></span> <b id="roomCode" class="code" dir="ltr"></b> <span data-i18n="roomTell"></span></p>
          <ul id="playerList"></ul>
          <div class="row">
            <button id="raceBtn" class="primary" data-i18n="startRace"></button>
            <button id="leaveRoomBtn" data-i18n="leaveRoom"></button>
          </div>
        </div>
      </section>

      <details>
        <summary data-i18n="controls"></summary>
        <p data-i18n-html="ctrlPhone"></p>
        <p data-i18n-html="ctrlGame"></p>
        <p data-i18n-html="ctrlEdit"></p>
      </details>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
